name: Release travelctl Windows CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Build Windows executable with Node SEA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          node --build-sea cli/sea-config.json
          ./dist/travelctl.exe --help
      - name: Package Windows download
        shell: pwsh
        run: |
          Copy-Item cli/README.md dist/README.md
          Compress-Archive -Path dist/travelctl.exe,dist/README.md -DestinationPath travelctl-windows-x64.zip
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelctl-windows-x64
          path: travelctl-windows-x64.zip
      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "travelctl ${{ github.ref_name }}" --notes "Windows CLI ZIP and source release"
          }
          gh release upload "${{ github.ref_name }}" travelctl-windows-x64.zip --clobber
