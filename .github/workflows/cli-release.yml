name: Release travelctl Windows CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install project dependencies
        run: npm ci
      - name: Compile the single TypeScript CLI source
        run: npm run cli:build
      - name: Build Windows executable with Node SEA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          node --build-sea cli/sea-config.json
          ./dist/travelctl.exe --help
      - name: Exercise real Windows EXE against local API mock
        run: node scripts/test-travelctl-exe.mjs
      - name: Record executable SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/travelctl.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: travelctl-windows-x64
          path: dist/travelctl.exe
      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "travelctl ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" dist/travelctl.exe --clobber
